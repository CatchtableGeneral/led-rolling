  const LOGO = document.querySelector('image').getAttribute('href');
  let dataKey = '';
  /* 슬라이드 화면 만들기: 등록부(slides.js)의 기본 슬라이드마다 요소를 만들고 데이터로 그림 */
  function renderers() {
    const m = { stores: (el, d) => window.renderStoresSlide(el, LOGO, d) };
    (window.BOARD_SLIDE_KEYS || []).forEach(k => { m[k] = (el, d) => window.renderBoardSlide(k, el, LOGO, d); });
    (window.REVENUE_SLIDE_KEYS || []).forEach(k => { m[k] = (el, d) => window.renderRevenueSlide(k, el, LOGO, d); });
    return m;
  }
  function mountSlides(data) {
    const R = renderers();
    window.SLIDES.forEach(s => {
      if (!R[s.id]) return;
      let el = document.querySelector('.slide[data-id="' + s.id + '"]');
      if (!el) {
        el = document.createElement('section'); el.className = 'slide'; el.dataset.id = s.id;
        document.getElementById('stage').appendChild(el);
      }
      try { R[s.id](el, data); } catch (e) { /* 한 슬라이드가 실패해도 나머지는 계속 */ }
    });
    /* 설정이 먼저 도착해 슬라이드 요소가 아직 없었다면(특히 단독 송출) 이제 만들어졌으니 지금 차례 슬라이드를 켬 */
    if (active.length) show(active[pos % active.length].id);
  }
  async function refreshData() {
    let data;
    try {
      if (!API) data = window.LED_DEMO;
      else {
        const r = await fetch(API + (API.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) + '&t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        data = await r.json();
        if (!data.rows) throw new Error(data.error || 'no rows');
        try { localStorage.setItem('led_data_cache', JSON.stringify(data)); } catch (e) {}
      }
    } catch (e) {
      try { data = JSON.parse(localStorage.getItem('led_data_cache')); } catch (x) {}   // 실패 시 마지막 데이터 유지
      if (!data) return;
    }
    const k = JSON.stringify(data);
    if (k === dataKey) return;
    dataKey = k;
    mountSlides(data);
  }

  function fit() {
    const s = Math.min(innerWidth / 3400, innerHeight / 1000);
    document.getElementById('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  /* 설정 읽기: API가 있으면 Apps Script, 없으면 같은 브라우저의 로컬 설정(데모) */
  async function getConfig() {
    if (!API) { try { return JSON.parse(localStorage.getItem('led_config')); } catch (e) { return null; } }
    const r = await fetch(API + (API.includes('?') ? '&' : '?') + 'action=config&token=' + encodeURIComponent(TOKEN) + '&t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    try { localStorage.setItem('led_config_cache', JSON.stringify(j)); } catch (e) {}
    return j;
  }

  let active = [], key = '', pos = 0, timer = null;
  const secEls = () => [...document.querySelectorAll('.slide')];

  function show(id) { secEls().forEach(e => e.classList.toggle('on', e.dataset.id === id)); }
  function step() {
    if (!active.length) return;
    pos = pos % active.length;
    show(active[pos].id);
    clearTimeout(timer);
    if (active.length > 1) timer = setTimeout(() => { pos++; step(); }, active[pos].sec * 1000);
  }

  /* 업로드 이미지: 파일을 받아 오면 슬라이드 요소를 만들고, 받아 오기 전에는 순환에서 제외 */
  const assets = new Map();   // 파일ID -> dataURL | 'loading' | 'fail'
  async function loadAsset(file) {
    if (assets.has(file)) return;
    assets.set(file, 'loading');
    try {
      let url;
      if (!API) url = localStorage.getItem('led_asset_' + file);
      else {
        const r = await fetch(API + (API.includes('?') ? '&' : '?') + 'action=asset&id=' + encodeURIComponent(file) + '&token=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
        const j = await r.json();
        if (!j.data) throw new Error(j.error || 'no data');
        url = 'data:' + j.mime + ';base64,' + j.data;
      }
      if (!url) throw new Error('empty');
      assets.set(file, url);
    } catch (e) { assets.set(file, 'fail'); setTimeout(() => assets.delete(file), 5 * 60 * 1000); }  // 실패하면 5분 뒤 다시 시도
    refresh();
  }
  const assetReady = f => { const v = assets.get(f); return v && v !== 'loading' && v !== 'fail'; };

  function syncCustomSections(customs) {
    const ids = new Set(customs.map(c => c.id));
    secEls().filter(e => e.classList.contains('custom') && !ids.has(e.dataset.id)).forEach(e => e.remove());
    customs.forEach(c => {
      if (!assetReady(c.file) || document.querySelector('.slide[data-id="' + c.id + '"]')) return;
      const sec = document.createElement('section');
      sec.className = 'slide custom'; sec.dataset.id = c.id;
      const img = document.createElement('img'); img.src = assets.get(c.file);
      sec.appendChild(img);
      document.getElementById('stage').appendChild(sec);
    });
  }

  async function refresh() {
    let cfg;
    try { cfg = await getConfig(); }
    catch (e) { try { cfg = JSON.parse(localStorage.getItem('led_config_cache')); } catch (x) {} if (!cfg) return; } // 실패 시 마지막 설정 유지
    const customs = window.normalizeConfig(cfg).slides.filter(s => s.type === 'image');
    customs.forEach(c => loadAsset(c.file));
    syncCustomSections(customs);
    const next = window.pickActive(cfg).filter(a => !a.type || assetReady(a.file));
    if (!next.length) return;          // 받아 오는 중이면 지금 화면 유지
    const k = JSON.stringify(next);
    if (k === key) return;             // 바뀐 게 없으면 그대로
    key = k;
    const curId = active[pos] && active[pos].id;
    active = next;
    const i = active.findIndex(a => a.id === curId);
    pos = i >= 0 ? i : 0;              // 지금 나오는 슬라이드가 계속 켜져 있으면 끊지 않음
    step();
  }

  refresh();
  refreshData();
  setInterval(refresh, POLL_MS);
  setInterval(refreshData, DATA_POLL_MS);
  addEventListener('storage', refresh);  // 데모 모드: 같은 브라우저에서 즉시 반영
  setTimeout(() => location.reload(), 24 * 3600 * 1000);
</script>
</body>
</html>
